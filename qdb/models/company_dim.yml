version: 2

models:
  - name: stg_company_metadata
    description: >
      Standardized company reference data from the company_metadata source.
      The model has one row per public market ticker symbol.
    columns:
      - name: symbol
        description: "Public market ticker symbol and primary key of the company record."
        data_tests:
          - not_null
          - unique

      - name: sector
        description: "Broad economic sector in which the company operates."
        data_tests:
          - not_null

      - name: industry
        description: "More specific industry classification within the company's sector."
        data_tests:
          - not_null

      - name: employees
        description: "Most recently reported employee count; null when the source does not provide a count."

      - name: country
        description: "Country in which the company is headquartered."
        data_tests:
          - not_null

      - name: exchange
        description: "Source-provided code for the stock exchange on which the company's shares trade."
        data_tests:
          - not_null

      - name: ipo_date
        description: "Date on which the company completed its initial public offering; null when unavailable."

      - name: updated_at
        description: "Timestamp when the source company metadata record was last updated."
        data_tests:
          - not_null

  - name: mart_company_dim
    description: >
      Current company dimension enriched with each company's latest available
      financial record. The model has one row per company symbol and preserves
      companies that do not yet have a matching financial record.
    columns:
      - name: symbol
        description: "Public market ticker symbol and primary key of this model."
        data_tests:
          - not_null
          - unique

      - name: sector
        description: "Broad economic sector in which the company operates."
        data_tests:
          - not_null

      - name: industry
        description: "More specific industry classification within the company's sector."
        data_tests:
          - not_null

      - name: employees
        description: "Most recently reported employee count; null when the source does not provide a count."

      - name: country
        description: "Country in which the company is headquartered."
        data_tests:
          - not_null

      - name: exchange
        description: "Source-provided code for the stock exchange on which the company's shares trade."
        data_tests:
          - not_null

      - name: ipo_date
        description: "Date on which the company completed its initial public offering; null when unavailable."

      - name: company_metadata_updated_at
        description: "Timestamp when the source company metadata record was last updated."
        data_tests:
          - not_null

      - name: total_revenue
        description: "Total revenue reported for the latest available financial period; null when no financial record is available."

      - name: total_revenue_prev
        description: "Source-provided revenue for the comparison period; null when unavailable."

      - name: revenue_growth_pct
        description: "Percentage change from comparison-period revenue to latest-period revenue; null when comparison revenue is unavailable or zero."

      - name: net_income
        description: "Net income reported for the latest available financial period; null when no financial record is available."

      - name: total_cash
        description: "Total cash reported for the latest available financial record; null when no financial record is available."

      - name: total_debt
        description: "Total debt reported for the latest available financial record; null when no financial record is available."

      - name: operating_cash_flow
        description: "Cash generated or used by normal business operations for the source-defined measurement period."

      - name: net_margin_pct
        description: "Net income as a percentage of total revenue; null when revenue is unavailable or zero."

      - name: net_cash
        description: "Total cash minus total debt for the latest available financial record."

      - name: has_negative_cash_flow
        description: "One when operating cash flow is negative, zero when nonnegative, and null when unavailable."
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false

      - name: going_concern
        description: "Source-provided flag indicating whether the latest financial record reports a going-concern condition."
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false

      - name: cash_as_of
        description: "Date on which the reported total-cash balance was measured."

      - name: financials_updated_at
        description: "Timestamp when the source financial record was last updated."

      - name: fiscal_year
        description: "Fiscal year associated with the latest available financial record."

      - name: period_end
        description: "End date of the latest available financial reporting period."

      - name: operating_cash_flow_as_of
        description: "End date of the period covered by the reported operating cash flow."

      - name: operating_cash_flow_basis
        description: "Source-provided period basis for operating cash flow, such as trailing twelve months."
