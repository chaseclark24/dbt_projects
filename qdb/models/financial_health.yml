version: 2

models:
  - name: stg_financials
    description: "Cleaned financial records with one row per symbol and reporting period."
    columns:
      - name: symbol
        description: "Public market ticker symbol."
        data_tests:
          - not_null

      - name: fiscal_year
        description: "Fiscal year represented by the financial record."
        data_tests:
          - not_null

      - name: period_end
        description: "End date of the reporting period."
        data_tests:
          - not_null

      - name: updated_at
        description: "Timestamp when the source record was last updated."
        data_tests:
          - not_null

  - name: mart_latest_financial_health
    description: "Latest available financial record and health metrics for each company."
    columns:
      - name: symbol
        description: "Public market ticker symbol and primary key of this mart."
        data_tests:
          - not_null
          - unique

      - name: period_end
        description: "Latest reporting period available for the company."
        data_tests:
          - not_null

      - name: has_negative_cash_flow
        description: "One when operating cash flow is negative, zero when nonnegative, and null when unavailable."
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false

      - name: going_concern
        description: "Source-provided going-concern flag."
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false

      - name: revenue_growth_pct
        description: "Percentage change from the source-provided previous revenue value. Null when previous revenue is unavailable or zero."

      - name: net_margin_pct
        description: "Percentage of margin. A comparison between revenue and net income"
        data_tests:
          - not_null

      - name: net_cash
        description: "A metric showing total_cash - total_debt"
        data_tests:
          - not_null

      - name: cash_as_of
        description: "As of date for the cash metric"
        data_tests:
          - not_null

      - name: operating_cash_flow_as_of
        description: "As of date for the operating cash flow metric"
        data_tests:
          - not_null

      - name: operating_cash_flow_basis
        description: "As of date for the cash metric"
        data_tests:
          - not_null

      - name: source_updated_at
        description: "total cash generated by a company's normal, day-to-day business operations"
        data_tests:
          - not_null

